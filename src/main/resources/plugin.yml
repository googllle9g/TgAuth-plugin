name: TgAuth
version: '${project.version}'
main: net.millyland.auth.TgAuthPlugin
api-version: '1.21'
author: TgAuth
description: Telegram-based authorization for your server, with optional FastLogin integration.
softdepend: [FastLogin]

commands:
  tgauth:
    description: Admin command for TgAuth
    usage: /tgauth <reload|unlink|forcelink|userinfo|fastlogin|pinreset|update|migrate> [player] [telegramId]
    permission: tgauth.admin
  tgcode:
    description: Resend your Telegram linking code
    usage: /tgcode
  tgchoose:
    description: Choose how to log in (used by the clickable choice and the dialog)
    usage: /tgchoose <method>

permissions:
  tgauth.admin:
    description: Allows administration of TgAuth
    default: op
  tgauth.addmethod:
    description: Allows /add-auth-method (the command only exists while a login-provider addon is installed)
    default: true
  tgauth.bypass:
    description: Allows bypassing the authorization requirement
    default: false
