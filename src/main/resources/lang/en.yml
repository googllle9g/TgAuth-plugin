# Vanilla dialog window (only used when ui.vanilla-dialog is true). Lines use & colour codes.
dialog:
  back: "&fBack"
  copy: "&fCopy code"
  close: "&fClose"
  choose:
    title: "&6&lHow do you want to log in?"
    body:
      - "&7Choose how to link your game account."
      - "&7You will log in this way every time you join."
    body-confirm:
      - "&7You have two linked login methods."
      - "&7Choose which one confirms this login."
    body-add:
      - "&7Choose the method you want to link to this account."
      - "&7You will be able to log in with either one."
    title-confirm: "&6&lConfirm your login"
    title-add: "&6&lAdd a login method"
    telegram-tooltip-confirm: "&7Confirm in Telegram"
    telegram-tooltip-add: "&7Add Telegram"
    telegram: "&b&lTelegram"
    telegram-tooltip: "&7Link with Telegram"
  telegram:
    title: "&b&lLink with Telegram"
    body:
      - "&eOpen the bot &f%bot%"
      - "&eand send it the command:"
      - "&a&l/link %code%"

copy:
  hover: "&7Click to copy"

